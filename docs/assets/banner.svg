<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Euron Open Conversation</title>
  <desc id="d">Euron Open Conversation: self-hosted AI mock interviews over live voice. Plans written from a resume or a job description, a realtime interviewer on OpenAI Realtime or Gemini Live, code questions, proctoring and scored reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0B1E"/>
      <stop offset="1" stop-color="#17133A"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#A99BFF"/>
      <stop offset="0.55" stop-color="#5B3FD6"/>
      <stop offset="1" stop-color="#1E1745"/>
    </radialGradient>
    <clipPath id="r"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <g fill="none" stroke="#7C66F2" stroke-opacity="0.14" stroke-width="1.2">
      <circle cx="1010" cy="180" r="120"/>
      <circle cx="1010" cy="180" r="170"/>
      <circle cx="1010" cy="180" r="225"/>
      <circle cx="1010" cy="180" r="285"/>
    </g>

    <!-- Mark: a voice waveform -->
    <g transform="translate(72 70)">
      <rect width="56" height="56" rx="16" fill="#F4F3FF"/>
      <rect x="13" y="22" width="5" height="12" rx="2.5" fill="#0D0B1E"/>
      <rect x="21.5" y="15" width="5" height="26" rx="2.5" fill="#0D0B1E"/>
      <rect x="30" y="10" width="5" height="36" rx="2.5" fill="#6D52F0"/>
      <rect x="38.5" y="19" width="5" height="18" rx="2.5" fill="#0D0B1E"/>
    </g>
    <text x="144" y="110" font-family="Bricolage Grotesque, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#F4F3FF" letter-spacing="-0.4">Euron Open Conversation</text>

    <text x="72" y="190" font-family="Bricolage Grotesque, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="-1.2">Practise interviews out loud.</text>
    <text x="72" y="236" font-family="Hanken Grotesk, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#BDB6E8">A live voice interviewer that asks follow-ups, then scores every answer.</text>
    <text x="72" y="292" font-family="Hanken Grotesk, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8F88C2" letter-spacing="0.4">RESUME OR JOB POST  ·  OPENAI OR GEMINI VOICE  ·  CODE  ·  PROCTORING  ·  REPORTS</text>

    <!-- The interviewer -->
    <g transform="translate(1010 180)">
      <circle r="132" fill="#6D52F0" fill-opacity="0.10"/>
      <circle r="104" fill="#6D52F0" fill-opacity="0.16"/>
      <circle r="78" fill="url(#orb)"/>
      <ellipse cx="-20" cy="-26" rx="34" ry="24" fill="#FFFFFF" fill-opacity="0.16"/>
      <g fill="#F4F3FF" transform="translate(-44 112)">
        <rect x="0" y="-8" width="6" height="16" rx="3" opacity="0.6"/>
        <rect x="12" y="-14" width="6" height="28" rx="3" opacity="0.8"/>
        <rect x="24" y="-20" width="6" height="40" rx="3"/>
        <rect x="36" y="-11" width="6" height="22" rx="3" opacity="0.85"/>
        <rect x="48" y="-17" width="6" height="34" rx="3"/>
        <rect x="60" y="-9" width="6" height="18" rx="3" opacity="0.7"/>
        <rect x="72" y="-13" width="6" height="26" rx="3" opacity="0.8"/>
        <rect x="84" y="-6" width="6" height="12" rx="3" opacity="0.55"/>
      </g>
    </g>
  </g>
</svg>
