  - name: "shares"
    description: "your share links."
  - name: "shared"
    description: "public, read-only reports behind share links."
  - name: "admin"
    description: "the control plane. Admins only (403 FORBIDDEN_ADMIN otherwise). Admins see accounts, usage, interview metadata and configuration, never anyone's answers or transcripts."
