name: e2e

# The full stack on the Floci AWS emulator: Terraform provisions KMS, Secrets Manager,
# Route53 and SES; the model providers and the realtime credential endpoints are the
# deterministic stand-ins in apps/stubs (no account or key anywhere). `make demo` seeds
# the demo accounts and the Stub provider, the integration suite runs under every mail
# backend, then Playwright drives the web app in a browser: sign-in, planning and
# holding an interview on the Stub voice, reports, and /admin.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-floci:
    name: end-to-end on Floci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Stack up
        run: make up
      - name: Demo data
        run: make demo
      - name: Integration matrix (every mail backend)
        run: make test-matrix
      - name: Browser tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p open-conversation logs --tail 200 api worker web migrate stubs terraform
